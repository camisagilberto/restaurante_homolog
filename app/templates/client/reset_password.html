{% extends 'base.html' %}
{% block title %}Redefinir senha{% endblock %}
{% block content %}
<section class="auth-layout">
  <div class="auth-copy panel panel-accent">
    <p class="eyebrow">Nova senha</p>
    <h2>Redefinir senha do usuário</h2>
    <p class="muted">Crie uma nova senha principal com no mínimo 8 caracteres.</p>
  </div>

  <form method="post" class="panel auth-form stacked-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div>
      <label for="password">Nova senha</label>
      <input id="password" type="password" name="password" autocomplete="new-password" minlength="8" required>
    </div>

    <div>
      <label for="password_confirm">Confirmar nova senha</label>
      <input id="password_confirm" type="password" name="password_confirm" autocomplete="new-password" minlength="8" required>
    </div>

    <button type="submit" class="btn btn-primary btn-block">Salvar nova senha</button>
    <a class="btn btn-secondary btn-block" href="{{ url_for('admin.login') }}">Voltar ao login</a>
  </form>
</section>
{% endblock %}
